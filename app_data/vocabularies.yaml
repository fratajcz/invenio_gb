  pid-type: expsys
  data-file: vocabularies/experimental_system.yaml
specimensource:
  pid-type: spmtyp
  data-file: vocabularies/specimen_source.yaml
projectid:
  pid-type: prid
  data-file: vocabularies/projectid.yaml

